<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Conversation context assembly and periodic long-term reflection</title><desc id="desc">Conversation context combines the recent five to ten turns, summaries of earlier turns, and long-term memories fetched through hybrid keyword and vector retrieval. RabbitMQ processes conversation summarization and memory ingestion asynchronously. Within long-term memory, reflection is triggered every few hours or days to enrich memories, merge related entries, and remove conflicting memories.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#637561" opacity=".18"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#82977a"/></marker></defs><rect width="1000" height="680" fill="url(#dots)"/><text x="35" y="34" text-anchor="start" fill="#657c5f" font-family="Arial,sans-serif" font-size="13" font-weight="600">01 / CONVERSATION CONTEXT</text><rect x="35" y="110" width="150" height="75" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="110.0" y="138" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Conversation</text><rect x="235" y="65" width="220" height="75" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="345.0" y="93" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Sensory memory</text><text x="345.0" y="115" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Recent 5–10 turns</text><rect x="235" y="170" width="220" height="75" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="345.0" y="198" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Conversation summaries</text><text x="345.0" y="220" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Earlier turns</text><rect x="480" y="275" width="205" height="75" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="582.5" y="303" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Hybrid retrieval</text><text x="582.5" y="325" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Keyword + vector</text><rect x="745" y="135" width="220" height="93" rx="9" fill="#345c48" stroke="#9aaf90" stroke-opacity=".5"/><text x="855.0" y="163" text-anchor="middle" fill="#f5f6e9" font-family="Arial,sans-serif" font-size="17" font-weight="600">Conversation context</text><text x="855.0" y="185" text-anchor="middle" fill="#f5f6e9" font-family="Arial,sans-serif" font-size="13" font-weight="400">Recent turns + summaries</text><text x="855.0" y="204" text-anchor="middle" fill="#f5f6e9" font-family="Arial,sans-serif" font-size="13" font-weight="400">+ retrieved memories</text><path d="M185 148 H210 V102 H235" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M455 102 H690 V157 H745" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M455 207 H670 V182 H745" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M185 148 H210 V312 H480" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)"/><text x="350" y="300" text-anchor="middle" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="400">retrieval query</text><path d="M685 312 H715 V208 H745" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)"/><text x="853" y="257" text-anchor="middle" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="400">FastAPI · Redis caching</text><path d="M35 393 H965" stroke="#b1bfa5" stroke-dasharray="4 7"/><text x="965" y="424" text-anchor="end" fill="#657c5f" font-family="Arial,sans-serif" font-size="13" font-weight="600">02 / BACKGROUND MEMORY UPDATES</text><rect x="35" y="484" width="205" height="87" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="137.5" y="512" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">RabbitMQ</text><text x="137.5" y="534" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Asynchronous updates</text><path d="M110 185 V484" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="126" y="369" text-anchor="start" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="400">enqueue updates</text><rect x="330" y="450" width="635" height="180" rx="12" fill="#d9e4cf" stroke="#9aac8b"/><text x="353" y="478" text-anchor="start" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="600">LONG-TERM MEMORY</text><rect x="355" y="502" width="225" height="80" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="467.5" y="530" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Stored memories</text><text x="467.5" y="552" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Neo4j knowledge graph</text><rect x="663" y="494" width="275" height="105" rx="9" fill="#fafbf5" stroke="#9aaf90" stroke-opacity=".5"/><text x="800.5" y="522" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="17" font-weight="600">Periodic reflection</text><text x="800.5" y="544" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Triggered every few hours / days</text><text x="800.5" y="563" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="13" font-weight="400">Enrich · merge · remove conflicts</text><path d="M240 527 H355" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="296" y="514" text-anchor="middle" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="400">ingest</text><path d="M240 507 H270 V264 H345 V245" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="281" y="374" text-anchor="start" fill="#657c5f" font-family="Arial,sans-serif" font-size="12" font-weight="400">summarize earlier turns</text><path d="M467 502 V371 H582 V350" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="578" y="365" text-anchor="middle" fill="#345444" font-family="Arial,sans-serif" font-size="12" font-weight="400"></text><path d="M580 522 H663" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="622" y="510" text-anchor="middle" fill="#657c5f" font-family="Arial,sans-serif" font-size="11" font-weight="400">read</text><path d="M663 568 H580" fill="none" stroke="#82977a" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="622" y="590" text-anchor="middle" fill="#657c5f" font-family="Arial,sans-serif" font-size="11" font-weight="400">update</text><text x="35" y="654" text-anchor="start" fill="#657c5f" font-family="Arial,sans-serif" font-size="11" font-weight="400">Solid arrows: conversation context and retrieval     Dashed arrows: background processing</text></svg>