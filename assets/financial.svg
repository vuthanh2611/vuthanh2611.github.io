<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title description"><title id="title">Financial multi-agent harness with specialist ReAct loops</title><desc id="description">A LangGraph manager plans, delegates work to technical, fundamental, and strategy agents, and combines their findings into financial analysis. Each specialist repeats a reason, tool execution, and observation loop. Tools include Python execution, pandas, market data, SQL, and document retrieval. Execution limits, retries, and tracing support the harness.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#8c6c59" opacity=".18"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ac8c76"/></marker></defs><rect width="1000" height="790" fill="url(#dots)"/><text x="35" y="30" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#8c6c59">02 / LANGGRAPH AGENT HARNESS</text><rect x="35" y="75" width="200" height="70" rx="9" fill="#fcf5ec" stroke="#bda18b" stroke-opacity=".6"/><text x="135" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#6e4b39">Financial question</text><rect x="350" y="60" width="300" height="100" rx="9" fill="#7b5542" stroke="#bda18b" stroke-opacity=".6"/><text x="500" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#fff7ed">Manager agent</text><text x="500" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#fff7ed">Plan · delegate · synthesize</text><text x="500" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#fff7ed">ReAct loop · LangGraph orchestration</text><rect x="785" y="75" width="180" height="70" rx="9" fill="#fcf5ec" stroke="#bda18b" stroke-opacity=".6"/><text x="875" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#6e4b39">Financial analysis</text><text x="875" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6e4b39">Combined findings</text><path d="M235 110 H350" stroke="#ac8c76" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M650 110 H785" stroke="#ac8c76" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="20" y="205" width="960" height="530" rx="12" fill="#ecdace" stroke="#bda18b" stroke-opacity=".6"/><text x="40" y="233" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#8c6c59">SPECIALIST REACT LOOPS</text><text x="730" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6e4b39">Delegate tasks / return findings</text><path d="M180 255 V247 H500 V160" stroke="#ac8c76" stroke-width="1.6" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="35" y="255" width="290" height="235" rx="9" fill="#fcf5ec" stroke="#bda18b" stroke-opacity=".6"/><text x="180" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#6e4b39">Technical agent</text><text x="180" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6e4b39">Market signals</text><rect x="70" y="332" width="215" height="49" rx="6" fill="#fffaf3" stroke="#bda18b" stroke-opacity=".6"/><text x="177.5" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#6e4b39">Reason / choose tool</text><rect x="70" y="412" width="215" height="49" rx="6" fill="#fffaf3" stroke="#bda18b" stroke-opacity=".6"/><text x="177.5" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#6e4b39">Execute / observe re