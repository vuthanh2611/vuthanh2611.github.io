<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="865" viewBox="0 0 1000 865" role="img" aria-labelledby="title description"><title id="title">Bond document RAG with contextual retrieval, reranking, and citations</title><desc id="description">Documents are parsed, cleaned, chunked with source metadata, embedded with Titan, and indexed in Qdrant. A relationship manager question and conversation history inform query rewriting. The query is embedded and used for filtered vector retrieval, followed by reranking and context assembly. Claude on AWS Bedrock generates an answer from the retrieved context, followed by answer checks and source citations. LangChain orchestrates the flow; Streamlit supported prototyping before production integration.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#7b6b8d" opacity=".15"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9d88b2"/></marker></defs><rect width="1000" height="865" fill="url(#dots)"/><text x="35" y="31" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#7b6b8d" font-weight="600">03 / BOND DOCUMENT RETRIEVAL SYSTEM</text><text x="35" y="66" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#7b6b8d" font-weight="600">01 / DOCUMENT PREPARATION &amp; INDEXING</text><rect x="35" y="87" width="150" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="110.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Bond documents</text><text x="110.0" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Source materials</text><rect x="230" y="87" width="150" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="305.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Extract &amp; clean</text><text x="305.0" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Document text</text><rect x="425" y="87" width="150" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="500.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Chunk &amp; tag</text><text x="500.0" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Passages +</text><text x="500.0" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">source metadata</text><rect x="620" y="87" width="155" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="697.5" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Titan embeddings</text><text x="697.5" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Passage vectors</text><rect x="820" y="87" width="145" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="892.5" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Qdrant index</text><text x="892.5" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Vectors + metadata</text><path d="M185 131 H230" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380 131 H425" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M575 131 H620" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M775 131 H820" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M35 223 H965" stroke="#bfb2cc" stroke-dasharray="4 7"/><text x="35" y="258" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#7b6b8d" font-weight="600">02 / CONTEXTUAL RETRIEVAL</text><rect x="35" y="292" width="180" height="80" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="125.0" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">RM question</text><text x="125.0" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Natural language</text><rect x="35" y="429" width="180" height="73" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="125.0" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Conversation history</text><text x="125.0" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Follow-up context</text><rect x="275" y="292" width="180" height="80" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="365.0" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Query rewriting</text><text x="365.0" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Contextualized question</text><rect x="505" y="292" width="180" height="80" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="595.0" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Titan embeddings</text><text x="595.0" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Query vector</text><rect x="760" y="292" width="205" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="862.5" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Filtered retrieval</text><text x="862.5" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Qdrant vector search</text><text x="862.5" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">+ metadata filters</text><path d="M215 332 H275" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M215 465 H245 V350 H275" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M455 332 H505" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M685 332 H760" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M892 175 V292" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="909" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="11" fill="#665076" font-weight="400">lookup</text><rect x="760" y="434" width="205" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="862.5" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Reranking</text><text x="862.5" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Reorder candidate passages</text><rect x="505" y="434" width="180" height="88" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="595.0" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Context assembly</text><text x="595.0" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Selected passages</text><text x="595.0" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">+ question</text><path d="M862 380 V434" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M760 478 H685" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M365 372 V478 H505" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><text x="429" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#665076" font-weight="400">question</text><path d="M35 556 H965" stroke="#bfb2cc" stroke-dasharray="4 7"/><text x="35" y="586" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#7b6b8d" font-weight="600">03 / GROUNDED ANSWERING</text><path d="M595 522 V604 H160 V628" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><text x="383" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#665076" font-weight="400">Assembled evidence + question</text><rect x="35" y="628" width="250" height="93" rx="8" fill="#736080" stroke="#b7a6c7" stroke-opacity=".7"/><text x="160.0" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#fffafd" font-weight="600">Claude on Bedrock</text><text x="160.0" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fffafd" font-weight="400">Answer from retrieved context</text><rect x="365" y="628" width="220" height="93" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="475.0" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Answer checks</text><text x="475.0" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Compare with retrieved text</text><rect x="700" y="628" width="265" height="93" rx="8" fill="#faf8fd" stroke="#b7a6c7" stroke-opacity=".7"/><text x="832.5" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#665076" font-weight="600">Answer + citations</text><text x="832.5" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665076" font-weight="400">Response with source references</text><path d="M285 674 H365" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585 674 H700" fill="none" stroke="#9d88b2" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="35" y="759" width="930" height="55" rx="8" fill="#ded6e8" stroke="#b7a6c7"/><text x="55" y="783" text-anchor="start" font-family="Arial,sans-serif" font-size="11" fill="#7b6b8d" font-weight="600">LANGCHAIN ORCHESTRATION</text><text x="643" y="793" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#665076" font-weight="400">Streamlit prototype → production integration</text><text x="35" y="842" text-anchor="start" font-family="Arial,sans-serif" font-size="11" fill="#7b6b8d" font-weight="400">Conceptual architecture · Document indexing is separate from the question-answering flow.</text></svg>